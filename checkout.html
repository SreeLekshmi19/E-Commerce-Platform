<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | ShopEase</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">

                <i class="fa-solid fa-bag-shopping"></i>

                ShopEase

            </div>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>

                <li><a href="index.html#products">Products</a></li>

                <li><a href="wishlist.html">Wishlist</a></li>

                <li><a href="cart.html">Cart</a></li>

            </ul>

            <div class="nav-icons">

                <button id="theme-btn">

                    <i class="fa-solid fa-moon"></i>

                </button>

                <a href="wishlist.html">

                    <i class="fa-solid fa-heart"></i>

                    <span id="wish-count">0</span>

                </a>

                <a href="cart.html">

                    <i class="fa-solid fa-cart-shopping"></i>

                    <span id="cart-count">0</span>

                </a>

            </div>

        </nav>

    </header>

    <!-- ================= TITLE ================= -->

    <section class="section-title">

        <h2>Checkout</h2>

    </section>

    <!-- ================= CHECKOUT ================= -->

    <section class="checkout-container">

        <form class="checkout-form" id="checkout-form">

            <h2>Billing Details</h2>

            <input type="text" id="name" placeholder="Full Name" required>

            <input type="email" id="email" placeholder="Email Address" required>

            <input type="tel" id="phone" placeholder="Phone Number" required>

            <textarea id="address" rows="4" placeholder="Shipping Address" required></textarea>

            <select id="payment" required>

                <option value="">Select Payment Method</option>

                <option value="cod">
                    Cash on Delivery
                </option>

                <option value="card">
                    Credit / Debit Card
                </option>

                <option value="upi">
                    UPI
                </option>

            </select>

            <div class="cart-summary mt-3">

                <h2>Order Summary</h2>

                <div style="display:flex;justify-content:space-between;margin:20px 0;">

                    <span>Items</span>

                    <span id="checkout-items">0</span>

                </div>

                <div style="display:flex;justify-content:space-between;margin-bottom:20px;">

                    <span>Total</span>

                    <strong id="checkout-total">$0.00</strong>

                </div>

            </div>

            <button type="submit" class="place-order">

                <i class="fa-solid fa-lock"></i>

                Place Order

            </button>

        </form>

    </section>

    <!-- ================= SUCCESS MODAL ================= -->

    <div id="successModal" style="display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.6);
        justify-content:center;
        align-items:center;
        z-index:9999;">

        <div style="
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            max-width:420px;
            width:90%;">

            <i class="fa-solid fa-circle-check" style="font-size:70px;color:#22c55e;"></i>

            <h2 style="margin:20px 0 10px;">

                Order Placed Successfully!

            </h2>

            <p>

                Thank you for shopping with ShopEase.

            </p>

            <button class="btn mt-3" onclick="goHome()">

                Continue Shopping

            </button>

        </div>

    </div>

    <!-- ================= SCRIPT ================= -->

    <script src="js/app.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const cart = JSON.parse(localStorage.getItem("cart")) || [];

            let total = 0;

            cart.forEach(item => {

                total += item.price * item.quantity;

            });

            document.getElementById("checkout-items").textContent = cart.length;

            document.getElementById("checkout-total").textContent =
                "$" + total.toFixed(2);

        });

        document
            .getElementById("checkout-form")
            .addEventListener("submit", function (e) {

                e.preventDefault();

                localStorage.removeItem("cart");

                document.getElementById("successModal").style.display = "flex";

            });

        function goHome() {

            window.location.href = "index.html";

        }

    </script>

</body>

</html>
