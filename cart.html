<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | ShopEase</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">

                <i class="fa-solid fa-bag-shopping"></i>

                ShopEase

            </div>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>

                <li><a href="index.html#products">Products</a></li>

                <li><a href="wishlist.html">Wishlist</a></li>

                <li><a href="checkout.html">Checkout</a></li>

            </ul>

            <div class="nav-icons">

                <button id="theme-btn">

                    <i class="fa-solid fa-moon"></i>

                </button>

                <a href="wishlist.html">

                    <i class="fa-solid fa-heart"></i>

                    <span id="wish-count">0</span>

                </a>

                <a href="cart.html">

                    <i class="fa-solid fa-cart-shopping"></i>

                    <span id="cart-count">0</span>

                </a>

            </div>

        </nav>

    </header>

    <!-- ================= PAGE TITLE ================= -->

    <section class="section-title">

        <h2>Your Shopping Cart</h2>

    </section>

    <!-- ================= CART ITEMS ================= -->

    <section class="cart-container">

        <div id="cart-items">

            <!-- JS will render items here -->

        </div>

        <div class="cart-summary">

            <h2>Order Summary</h2>

            <hr>

            <br>

            <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:600;">

                <span>Total</span>

                <span id="cart-total">$0.00</span>

            </div>

            <button class="checkout-btn" onclick="window.location.href='checkout.html'">

                Proceed to Checkout

            </button>

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer">

            <p>

                © 2026 ShopEase. All Rights Reserved.

            </p>

        </div>

    </footer>

    <!-- ================= SCRIPT ================= -->

    <script src="js/app.js"></script>

</body>

</html>
